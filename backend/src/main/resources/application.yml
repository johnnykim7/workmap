spring:
  application:
    name: workmap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/workmap?stringtype=unspecified}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${WORKMAP_UPLOAD_MAX_SIZE:10MB}
      max-request-size: ${WORKMAP_UPLOAD_MAX_SIZE:10MB}

server:
  port: ${SERVER_PORT:8186}

# MyBatis (JPA 미사용 — 조직 표준)
mybatis:
  type-aliases-package: com.therecommerce.workmap
  # type-handlers-package 자동 스캔은 쓰지 않는다(CR-008): 이 패키지를 스캔하면 StringListJsonTypeHandler와
  # LongListJsonTypeHandler가 같은 raw List 키로 자동등록되어 충돌(active_tabs를 Long 핸들러가 가로채 500).
  # 대신 AppConfig.ConfigurationCustomizer에서 StringListJsonTypeHandler만 List에 명시 등록하고,
  # LongListJsonTypeHandler는 매퍼 XML(CommentMapper)에서 명시 지정으로만 사용한다.
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# bp-common-lib 설정 (응답/예외/페이징/JWT)
jwt:
  secret: ${JWT_SECRET:bbBhO0o1ZGV2LXdvcmttYXAtbG9jYWwtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZA==}
  access-expiration: 3600000
  refresh-expiration: 604800000
paging:
  default-size: 20
  max-size: 100
logging:
  request:
    include-body: false
    max-body-length: 1000

# WorkMap 도메인 설정
workmap:
  # 장기 미변경(정체) 기준 일수(POL-003). 회사홈 지표/검토 정체 판정 기준. 기본 7.
  stale:
    threshold-days: ${WORKMAP_STALE_DAYS:7}
  # 파일 업로드(CR-024 — 리치 에디터 인라인 이미지). 로컬 디스크 저장.
  upload:
    dir: ${WORKMAP_UPLOAD_DIR:/home/therecommerce/workmap/uploads}
    # 공개 URL prefix. 정적 서빙 경로(GET /api/v1/files/serve/{name})·화이트리스트와 동일해야 함.
    public-base: ${WORKMAP_UPLOAD_PUBLIC_BASE:/api/v1/files/serve}
    # 허용 MIME 타입(쉼표 구분). 기본=이미지 4종.
    allowed-content-types: ${WORKMAP_UPLOAD_ALLOWED_TYPES:image/png,image/jpeg,image/gif,image/webp}
  # 인증(CR-027 — 이메일 초대 가입 + 비밀번호 OTP).
  auth:
    otp:
      expires-minutes: ${WORKMAP_OTP_EXPIRES_MIN:10}
      max-attempts: ${WORKMAP_OTP_MAX_ATTEMPTS:5}
      resend-cooldown-seconds: ${WORKMAP_OTP_RESEND_COOLDOWN:60}
      invitation-expires-hours: ${WORKMAP_INVITE_EXPIRES_HOURS:72}
  # bp-notification 연동(WMP-AUTH-009). apiKey는 운영 env(WMP_NOTI_API_KEY)로 주입 — 소스 미커밋.
  notification:
    base-url: ${WMP_NOTI_BASE_URL:http://59.8.160.12:8185}
    api-key: ${WMP_NOTI_API_KEY:}
    enabled: ${WMP_NOTI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
