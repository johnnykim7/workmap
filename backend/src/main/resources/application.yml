spring:
  application:
    name: workmap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/workmap?stringtype=unspecified}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8186}

# MyBatis (JPA 미사용 — 조직 표준)
mybatis:
  type-aliases-package: com.therecommerce.workmap
  type-handlers-package: com.therecommerce.workmap.common.mybatis
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# bp-common-lib 설정 (응답/예외/페이징/JWT)
jwt:
  secret: ${JWT_SECRET:bbBhO0o1ZGV2LXdvcmttYXAtbG9jYWwtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZA==}
  access-expiration: 3600000
  refresh-expiration: 604800000
paging:
  default-size: 20
  max-size: 100
logging:
  request:
    include-body: false
    max-body-length: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
