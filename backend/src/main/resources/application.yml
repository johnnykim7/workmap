spring:
  application:
    name: workmap
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/workmap?stringtype=unspecified}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${WORKMAP_UPLOAD_MAX_SIZE:10MB}
      max-request-size: ${WORKMAP_UPLOAD_MAX_SIZE:10MB}

server:
  port: ${SERVER_PORT:8186}

# MyBatis (JPA 미사용 — 조직 표준)
mybatis:
  type-aliases-package: com.therecommerce.workmap
  # type-handlers-package 자동 스캔은 쓰지 않는다(CR-008): 이 패키지를 스캔하면 StringListJsonTypeHandler와
  # LongListJsonTypeHandler가 같은 raw List 키로 자동등록되어 충돌(active_tabs를 Long 핸들러가 가로채 500).
  # 대신 AppConfig.ConfigurationCustomizer에서 StringListJsonTypeHandler만 List에 명시 등록하고,
  # LongListJsonTypeHandler는 매퍼 XML(CommentMapper)에서 명시 지정으로만 사용한다.
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# bp-common-lib 설정 (응답/예외/페이징/JWT)
jwt:
  secret: ${JWT_SECRET:bbBhO0o1ZGV2LXdvcmttYXAtbG9jYWwtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZA==}
  access-expiration: 3600000
  refresh-expiration: 604800000
paging:
  default-size: 20
  max-size: 100
logging:
  request:
    include-body: false
    max-body-length: 1000

# WorkMap 도메인 설정
workmap:
  # 장기 미변경(정체) 기준 일수(POL-003). 회사홈 지표/검토 정체 판정 기준. 기본 7.
  stale:
    threshold-days: ${WORKMAP_STALE_DAYS:7}
  # 프로젝트 건강 지표(CR-043, WMP-HOME-004~014).
  metrics:
    # Work Item Age SLE(임계일). 초과 시 위험 신호. 기본 10.
    sle-days: ${WORKMAP_METRICS_SLE_DAYS:10}
    # 재작업률 위험 임계(%). 이 이상이면 품질축 경고. 기본 10.
    rework-threshold-pct: ${WORKMAP_METRICS_REWORK_PCT:10}
    # Monte Carlo 예측 참조 이력(일). 기본 30.
    forecast-history-days: ${WORKMAP_METRICS_FORECAST_DAYS:30}
  # 파일 업로드(CR-024 — 리치 에디터 인라인 이미지). 로컬 디스크 저장.
  upload:
    dir: ${WORKMAP_UPLOAD_DIR:/home/therecommerce/workmap/uploads}
    # 공개 URL prefix. 정적 서빙 경로(GET /api/v1/files/serve/{name})·화이트리스트와 동일해야 함.
    public-base: ${WORKMAP_UPLOAD_PUBLIC_BASE:/api/v1/files/serve}
    # 허용 MIME 타입(쉼표 구분). 이미지 4종(에디터 인라인) + 첨부 문서류(WMP-WI-012 실제 업로드).
    allowed-content-types: ${WORKMAP_UPLOAD_ALLOWED_TYPES:image/png,image/jpeg,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/zip,application/x-zip-compressed,text/plain,text/csv,text/markdown,text/x-markdown}
    # 허용 확장자(쉼표 구분, 점 제외). MIME 보조 검사 — md 등 브라우저가 MIME를 안 주는 파일 대응(CR-037).
    allowed-extensions: ${WORKMAP_UPLOAD_ALLOWED_EXTS:png,jpg,jpeg,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,zip,txt,csv,md,markdown}
  # 인증(CR-027 — 이메일 초대 가입(토큰) + 비밀번호 재설정(토큰)·변경(OTP)).
  auth:
    otp:
      expires-minutes: ${WORKMAP_OTP_EXPIRES_MIN:10}
      max-attempts: ${WORKMAP_OTP_MAX_ATTEMPTS:5}
      resend-cooldown-seconds: ${WORKMAP_OTP_RESEND_COOLDOWN:60}
      invitation-expires-hours: ${WORKMAP_INVITE_EXPIRES_HOURS:72}
      reset-token-expires-minutes: ${WORKMAP_RESET_TOKEN_EXPIRES_MIN:30}
  # bp-notification 연동(WMP-AUTH-009). apiKey는 운영 env(WMP_NOTI_API_KEY)로 주입 — 소스 미커밋.
  notification:
    base-url: ${WMP_NOTI_BASE_URL:http://59.8.160.12:8185}
    api-key: ${WMP_NOTI_API_KEY:}
    enabled: ${WMP_NOTI_ENABLED:true}
    # 메일 링크(초대·재설정) 절대 URL 조립용 FE 베이스(CR-027 토큰 보정).
    web-base-url: ${WMP_WEB_BASE_URL:http://59.8.160.12:3186}
  # AI 업무 초안(aimbase) 연동(WMP-WI-019, CR-050). 키·워크플로 id는 env 주입 — 미주입 시 초안 API가 미설정 응답.
  aimbase:
    base-url: ${WMP_AIMBASE_BASE_URL:http://59.8.160.12:8280}
    api-key: ${WMP_AIMBASE_KEY:}
    epic-workflow-id: ${WMP_AIMBASE_EPIC_WF:}
    story-task-workflow-id: ${WMP_AIMBASE_STORY_TASK_WF:}
    poll-interval-ms: ${WMP_AIMBASE_POLL_INTERVAL_MS:3000}
    poll-max-attempts: ${WMP_AIMBASE_POLL_MAX_ATTEMPTS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
