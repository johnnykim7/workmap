# 운영 프로필 — docker compose api 컨테이너에서 활성(SPRING_PROFILES_ACTIVE=prod).
# DB는 호스트 PG(컨테이너에서 host.docker.internal로 접근). 민감값은 서버 .env로 주입.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://host.docker.internal:5432/workmap?stringtype=unspecified}
    username: ${DB_USERNAME:platform}
    password: ${DB_PASSWORD:platform}

management:
  endpoint:
    health:
      show-details: never
